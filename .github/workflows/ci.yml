name: Taskapp CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: taskdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: taskdb
      PGUSER: postgres
      PGPASSWORD: ci-only-password

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: python -m pip install -r taskapp/requirements.txt

      - name: Create test database table
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(connect_timeout=5) as conn:
              conn.execute("""
                  CREATE TABLE tasks (
                      id SERIAL PRIMARY KEY,
                      title TEXT NOT NULL,
                      completed BOOLEAN NOT NULL DEFAULT FALSE
                  )
              """)
              conn.execute(
                  "INSERT INTO tasks (title) VALUES (%s)",
                  ("Task created by CI",),
              )
          PY

      - name: Start application and run smoke tests
        run: |
          gunicorn \
            --chdir taskapp \
            --bind 127.0.0.1:8080 \
            --workers 2 \
            --worker-class gthread \
            --threads 4 \
            --access-logfile - \
            --error-logfile - \
            app:app > /tmp/taskapp.log 2>&1 &

          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:8080/readyz > /dev/null; then
              break
            fi
            sleep 1
          done

          python3 scripts/smoke_test.py --url http://127.0.0.1:8080

      - name: Build application image
        run: |
          docker build \
            --tag taskapp:${{ github.sha }} \
            ./taskapp

      - name: Test application image
        run: |
          docker run -d \
            --name taskapp-ci \
            --network host \
            -e PGHOST \
            -e PGPORT \
            -e PGDATABASE \
            -e PGUSER \
            -e PGPASSWORD \
            taskapp:${{ github.sha }}

          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:8000/readyz > /dev/null; then
              break
            fi
            sleep 1
          done

          python3 scripts/smoke_test.py --url http://127.0.0.1:8000

      - name: Show application logs on failure
        if: failure()
        run: cat /tmp/taskapp.log 2>/dev/null || true

      - name: Show container logs and clean up
        if: always()
        run: |
          if docker container inspect taskapp-ci > /dev/null 2>&1; then
            docker logs taskapp-ci
            docker rm -f taskapp-ci
          fi
EOF
