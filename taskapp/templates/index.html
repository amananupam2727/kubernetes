<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aman's Task Tracker-Version 2</title>
  <style>
    body { font-family: system-ui; background: #eef2f7; color: #172033;
           max-width: 720px; margin: 60px auto; padding: 20px; }
    main { background: white; padding: 28px; border-radius: 16px; }
    form { display: flex; gap: 10px; }
    input { flex: 1; min-width: 0; padding: 12px; }
    button { padding: 10px 16px; cursor: pointer; }
    li { display: flex; justify-content: space-between; align-items: center;
         gap: 12px; padding: 16px 0; border-bottom: 1px solid #ddd; }
    ul { padding: 0; list-style: none; }
    .done { text-decoration: line-through; color: #657080; }
  </style>
</head>
<body>
<main>
  <h1>Aman's Task Tracker-Version 2</h1>
  <p>Python + Kubernetes + PostgreSQL</p>
  <form action="/tasks" method="post">
    <input name="title" aria-label="Task title"
           placeholder="What will you learn next?" maxlength="200" required>
    <button type="submit">Add task</button>
  </form>
  <ul>
    {% for task in tasks %}
    <li>
      <span class="{{ 'done' if task.completed else '' }}">{{ task.title }}</span>
      {% if not task.completed %}
      <form action="/tasks/{{ task.id }}/complete" method="post">
        <button type="submit">Complete</button>
      </form>
      {% else %}
      <span>Done</span>
      {% endif %}
    </li>
    {% else %}
    <li>No tasks yet. Add your first one.</li>
    {% endfor %}
  </ul>
</main>
</body>
</html>
