apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: production
data:
  01-taskapp.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 \
      --username postgres \
      --dbname taskdb \
      --set=app_password="$TASKAPP_DB_PASSWORD" <<'SQL'
    CREATE ROLE taskapp LOGIN PASSWORD :'app_password';
    CREATE TABLE public.tasks (
      id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      title VARCHAR(200) NOT NULL,
      completed BOOLEAN NOT NULL DEFAULT FALSE
    );
    GRANT CONNECT ON DATABASE taskdb TO taskapp;
    GRANT USAGE ON SCHEMA public TO taskapp;
    GRANT SELECT, INSERT, UPDATE ON public.tasks TO taskapp;
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO taskapp;
    SQL
